gate:
  exact_hold_max_ratio_of_traced: 1.0
  whole_account: { min_mule_score: 0.85, min_signals: 2, officer_confirmation: true }
  fast_restoration_below: 5000000        # Rs 50,000 victim refund without a court order: press reports say yes, R1 did not find it
                                         # in the SOP text (it found no Rs 50,000 limit on the 90-day lift). Kept, cites the unverified SOP.
  protected_number_prefixes: ["140", "1600", "1601"]
  telecom_block: { min_signals: 2, min_telecom_signals: 1 }
  shield_max_action: EXACT_HOLD
  bank_self_hold_min_signals: 2
requisition:
  magistrate_intimation_hours: 24
  min_signing_rank: "Sub-Inspector"
  checks:
    - { id: signed_dated, label: "Signed and dated by an officer of competent rank", applies_to: [BNSS_106, BNSS_107, CRPC_102], severity: defect, sources: [allahabad-protocol] }
    - { id: case_reference, label: "FIR number or NCRP acknowledgement number given", applies_to: [BNSS_106, BNSS_107, CRPC_102], severity: defect, sources: [allahabad-protocol] }
    - { id: exact_amount, label: "Exact amount to hold is stated (not 'freeze the account')", applies_to: [BNSS_106, BNSS_107, CRPC_102], severity: defect, sources: [allahabad-protocol, himanshu-gupta] }
    - { id: account_nexus, label: "Account and the fraud transaction that links it are identified", applies_to: [BNSS_106, BNSS_107, CRPC_102], severity: defect, sources: [navneet-traders], status: assumed }
    - { id: criminal_nature, label: "Discloses a criminal offence, not a civil or commercial dispute", applies_to: [BNSS_106, BNSS_107, CRPC_102], severity: review, sources: [allahabad-protocol] }
    - { id: magistrate_intimation, label: "Magistrate informed within 24 hours", applies_to: [BNSS_106, CRPC_102], severity: defect, sources: [allahabad-protocol, bnss] }
    - { id: magistrate_order, label: "Magistrate's order attached", applies_to: [BNSS_107], severity: defect, sources: [bnss] }
regimes:
  RBI_BANK:
    label: "Bank-initiated hold (RBI draft)"
    status: draft
    in_force_from: "2027-04-01"           # draft Annex III is proposed to apply from 1 Apr 2027; before then a bank hold on this basis is contested
    max_days: 60
    min_amount: 100000                    # Rs 1,000
    exempt_account_types: [NODAL, POOL, ESCROW]
    sources: [rbi-draft-mule-2026]
    clocks:
      - { id: notice, label: "Tell the account holder", starts_on: HOLD_PLACED, days: 1, satisfied_by: [NOTICE_SENT, RELEASED], on_expiry: OVERDUE, sources: [rbi-draft-mule-2026] }
      - { id: explanation, label: "Holder's window to explain", starts_on: NOTICE_SENT, days: 20, satisfied_by: [REPLY_RECEIVED, RELEASED], on_expiry: DECIDE, sources: [rbi-draft-mule-2026] }
      - { id: decide_after_reply, label: "Decide after the holder replies", starts_on: REPLY_RECEIVED, days: 10, satisfied_by: [RELEASED, REFERRED_TO_LEA, REVIEWED], on_expiry: OVERDUE, sources: [rbi-draft-mule-2026] }
      - { id: decide_no_reply, label: "Decide if the holder never replies", starts_on: HOLD_PLACED, days: 30, satisfied_by: [REPLY_RECEIVED, RELEASED, REFERRED_TO_LEA, REVIEWED], on_expiry: OVERDUE, sources: [rbi-draft-mule-2026] }
      - { id: lea_handoff, label: "Hand over to police regime after referral", starts_on: REFERRED_TO_LEA, days: 0, satisfied_by: [RELEASED], on_expiry: CONVERT, convert_to: MHA_POLICE, status: assumed, sources: [rbi-draft-mule-2026] }
      - { id: max_cap, label: "60-day maximum", starts_on: HOLD_PLACED, days: 60, alert_before_days: 5, satisfied_by: [RELEASED, CONVERTED], on_expiry: AUTO_RELEASE, sources: [rbi-draft-mule-2026] }   # RBI draft Annex III para 5 "Maximum duration": 60 days (read 24 Nov)
  MHA_POLICE:
    label: "Police-requested hold (MHA SOP)"
    status: final
    max_days: null
    sources: [mha-sop-2026-01]
    clocks:
      - { id: grm_upload, label: "Upload to the I4C grievance module", starts_on: HOLD_PLACED, days: 7, satisfied_by: [GRM_UPLOADED, RELEASED], on_expiry: OVERDUE, sources: [mha-sop-2026-01] }
      - { id: io_decision, label: "Investigating officer decides", starts_on: HOLD_PLACED, days: 15, satisfied_by: [IO_DECISION, RELEASED, COURT_ORDER_RECEIVED], on_expiry: ESCALATE, sources: [mha-sop-2026-01] }
      # MHA SOP Para 10.1 / Annexure I item 3: for holds contested through the grievance module, the bank MAY remove the hold
      # after 90 days (after EDD, as police direct), with 15 days' notice; police may extend once by 90 days. No amount limit.
      # It is not automatic, so at 90 days the bank must DECIDE. The SOP counts from the grievance (Para 10.1) or the hold
      # (Annexure I); we use the hold date, so this stays assumed.
      - { id: release_90, label: "Review at 90 days: bank may lift the hold unless police extend it", starts_on: HOLD_PLACED, days: 90, alert_before_days: 15, extendable: { times: 1, days: 90 }, satisfied_by: [RELEASED, COURT_ORDER_RECEIVED, REVIEWED], on_expiry: DECIDE, status: assumed, sources: [mha-sop-2026-01] }
  DIGITAL_SUSPENSION:
    label: "Digital-banking suspension"
    status: final
    max_days: 45
    sources: [mha-sop-2026-01]
    clocks:
      - { id: cap, label: "45-day maximum", starts_on: HOLD_PLACED, days: 45, alert_before_days: 3, satisfied_by: [RELEASED], on_expiry: AUTO_RELEASE, sources: [mha-sop-2026-01] }
  NPCI_CHARGEBACK:
    label: "UPI fraud chargeback"
    status: final
    max_days: 15
    sources: [npci-oc-235]
    clocks:
      - { id: resolve, label: "Resolve the chargeback", starts_on: HOLD_PLACED, days: 15, satisfied_by: [RELEASED, REVIEWED], on_expiry: OVERDUE, status: assumed, sources: [npci-oc-235] }   # 15 days is from secondary commentary (R1)
  COURT_ORDER:
    label: "Court-ordered attachment"
    status: final
    max_days: null
    sources: [bnss]
    clocks: []
  TRAI_UCC:
    label: "Telecom restriction for spam/fraud calls (TRAI)"
    status: final
    max_days: null
    sources: [trai-tcccpr-2, trai-tcccpr-3]
    clocks:
      # R1: the 15-day bar comes from the Second Amendment (Feb 2025), not the Third.
      - { id: bar_review, label: "Review the 15-day outgoing-call bar", starts_on: HOLD_PLACED, days: 15, satisfied_by: [REVIEWED, RELEASED], on_expiry: DECIDE, sources: [trai-tcccpr-2] }
